<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Avatar GLB Test</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            color: white;
            background: #222d;
            padding: 10px;
            font: 14px Arial;
            border-radius: 8px
        }

        canvas {
            display: block
        }
    </style>
</head>

<body>
    <div id="info">Loading female avatar...</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        const info = document.getElementById("info");
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x20232b);

        const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);
        camera.position.set(0, 1.15, 4.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
        const key = new THREE.DirectionalLight(0xffffff, 2.5);
        key.position.set(2, 4, 5);
        scene.add(key);

        const loader = new THREE.GLTFLoader();
        loader.load(
            "http://127.0.0.1:8000/assets/avatars/female_avatar.glb?test=" + Date.now(),
            gltf => {
                const root = gltf.scene;
                scene.add(root);

                root.traverse(o => {
                    if (!o.isMesh) return;
                    o.visible = true;
                    o.frustumCulled = false;
                    const mats = Array.isArray(o.material) ? o.material : [o.material];
                    mats.forEach(m => { if (m) { m.visible = true; m.side = THREE.DoubleSide; m.transparent = false; m.opacity = 1; } });
                });

                root.updateMatrixWorld(true);
                let box = new THREE.Box3().setFromObject(root);
                let size = box.getSize(new THREE.Vector3());
                let center = box.getCenter(new THREE.Vector3());

                const s = 2.2 / size.y;
                root.scale.multiplyScalar(s);
                root.updateMatrixWorld(true);

                box = new THREE.Box3().setFromObject(root);
                center = box.getCenter(new THREE.Vector3());
                root.position.x -= center.x;
                root.position.y -= box.min.y;
                root.position.z -= center.z;
                root.updateMatrixWorld(true);

                box = new THREE.Box3().setFromObject(root);
                center = box.getCenter(new THREE.Vector3());

                camera.position.set(0, 1.12, 4.0);
                camera.lookAt(0, 1.10, 0);

                const helper = new THREE.Box3Helper(box, 0x00ff00);
                scene.add(helper);

                info.textContent = "GLB RENDER TEST: LOADED | height=" + box.getSize(new THREE.Vector3()).y.toFixed(2);
                console.log("TEST avatar box", box.min, box.max);
            },
            undefined,
            err => {
                console.error(err);
                info.textContent = "GLB LOAD FAILED — check console";
            }
        );

        addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        (function loop() {
            requestAnimationFrame(loop);
            renderer.render(scene, camera);
        })();
    </script>
</body>

</html>
